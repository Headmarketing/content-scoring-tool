services:
  - type: web
    name: content-scoring-tool
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 600
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: PYTHONSAFEPATH
        value: "1"
